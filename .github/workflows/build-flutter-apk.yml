name: Build Flutter APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['flutter-v*']

permissions:
  contents: read

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    outputs:
      debug_signed: ${{ steps.signing.outputs.debug_signed }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Configure release signing
        # Secrets are documented in docs/android-signing.md. Without them (pull requests,
        # repositories that have not added the key yet) the build is debug-signed.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Android signing secrets are not set; building a debug-signed APK."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build release APK and app bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Check signing key
        # A debug-signed build cannot be uploaded to Play or update an installation signed
        # with the upload key. Tags still publish it, but only as a pre-release test build,
        # never as the latest full release.
        id: signing
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-cert.txt
          if grep -q 'CN=Android Debug' /tmp/apk-cert.txt; then
            echo "::warning::APK is debug-signed. Add the Android signing secrets for a full release (docs/android-signing.md)."
            echo "debug_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "debug_signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify packaged resources and calculate checksum
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" > /tmp/apk-files.txt
          unzip -p "$APK" resources.arsc | strings > /tmp/apk-resources.txt
          grep -qE '\.wav$' /tmp/apk-files.txt
          grep -q dclix_alert /tmp/apk-resources.txt
          # The public trust certificate must ship, but does not fix the server's
          # missing hostname SAN. UAT checkout still needs a valid server certificate.
          grep -q uat_apimacuat /tmp/apk-resources.txt
          grep -qE '\.pem$' /tmp/apk-files.txt
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/
          cp build/app/outputs/bundle/release/app-release.aab build/release/
          cd build/release
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum app-release.aab > app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dclix-flutter-apk
          path: flutter_app/build/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: build-flutter-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dclix-flutter-apk
          path: release-apk
      - name: Detect release channel
        # Suffixed versions (flutter-v2.14.0-beta.1) and debug-signed builds publish as
        # pre-releases.
        id: channel
        env:
          DEBUG_SIGNED: ${{ needs.build-flutter-apk.outputs.debug_signed }}
        run: |
          version="${GITHUB_REF_NAME#flutter-v}"
          prerelease=false
          name="D-Clix v$version"
          case "$version" in *-*) prerelease=true ;; esac
          if [ "$DEBUG_SIGNED" = "true" ]; then
            prerelease=true
            name="$name (test build)"
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Publish APK and app bundle
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.channel.outputs.name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
