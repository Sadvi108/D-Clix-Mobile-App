name: Build Flutter IPA
# macOS minutes cost 10x Linux, so this runs on demand and on release tags only.
#
# Signs with an App Store Connect API key (Admin role), which lets Xcode create the
# distribution certificate and profile itself (cloud signing). Secrets:
#   APPSTORE_KEY_ID              the key's 10-character ID
#   APPSTORE_ISSUER_ID           the issuer ID above the keys table
#   APPSTORE_API_KEY_P8_BASE64   base64 of AuthKey_<id>.p8
# Without them the IPA is unsigned and only installable after re-signing.
on:
  workflow_dispatch:
    inputs:
      method:
        description: app-store-connect (TestFlight/App Store) or release-testing (Ad Hoc, registered devices)
        type: choice
        options: [app-store-connect, release-testing]
        default: app-store-connect
      testflight:
        description: Upload to TestFlight (app-store-connect only; needs the app record in App Store Connect)
        type: boolean
        default: false
  push:
    tags: ['flutter-v*']

permissions:
  contents: read

env:
  APPLE_TEAM_ID: 4Z59DEGJEZ

jobs:
  build-flutter-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build release IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          METHOD: ${{ inputs.method || 'app-store-connect' }}
          TESTFLIGHT: ${{ inputs.testflight || false }}
        run: |
          mkdir -p build/release
          if [ -z "$APPSTORE_API_KEY_P8_BASE64" ]; then
            echo "::warning::App Store Connect API key secrets are not set; building an unsigned IPA."
            flutter build ipa --release --no-codesign
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/flutter_app/build/release/dclix-release-unsigned.ipa" Payload)
            exit 0
          fi

          KEY="$RUNNER_TEMP/AuthKey_$APPSTORE_KEY_ID.p8"
          echo "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
            -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID")

          # Release.xcconfig only backs the Runner target, so the team stays off the Pods.
          printf 'DEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Automatic\n' "$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig
          # flutter build ipa cannot pass the API key to xcodebuild, so archive directly.
          flutter build ios --release --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${AUTH[@]}" archive

          DESTINATION=export
          if [ "$TESTFLIGHT" = "true" ] && [ "$METHOD" = "app-store-connect" ]; then DESTINATION=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          if [ "$DESTINATION" = "upload" ]; then
            echo "Uploaded to App Store Connect; it appears in TestFlight after Apple processes it."
            ditto -c -k --keepParent "$RUNNER_TEMP/Runner.xcarchive" build/release/Runner.xcarchive.zip
          else
            cp "$RUNNER_TEMP"/export/*.ipa "build/release/dclix-release-$METHOD.ipa"
          fi
          rm -f "$KEY"
      - name: Calculate checksum
        working-directory: flutter_app/build/release
        run: for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: dclix-flutter-ipa
          path: flutter_app/build/release/
          if-no-files-found: error

  release:
    # The APK workflow creates the GitHub release for the tag; this attaches the IPA to it.
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: build-flutter-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dclix-flutter-ipa
          path: release-ipa
      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" release-ipa/* --clobber
