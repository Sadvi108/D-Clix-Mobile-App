name: dclix_app
description: D-Clix — Premium sports academy student app (Flutter port).
publish_to: "none"
# 2.12.0+18 — MUST stay above the Expo app's 2.11.1+17.
#
# Both ship as applicationId com.dclix.clubapp, so this APK replaces the Expo one on a
# member's phone. Android refuses to install a lower versionCode, so 7 would have failed
# to update every existing install with "app not installed" and no further explanation.
version: 2.13.1+22

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # UI & assets
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  printing: ^5.13.4
  pdf: ^3.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Useful helpers
  intl: ^0.19.0
  percent_indicator: ^4.2.4

  # QR (when you wire up the real scanner)
  mobile_scanner: ^7.4.2

  # Persistence (theme choice, etc.)
  shared_preferences: ^2.3.3
  # Encrypted storage for the bearer token (Keychain / Android Keystore).
  flutter_secure_storage: ^9.2.4
  # OS notifications with a bundled sound (Android channels / iOS UNNotification).
  flutter_local_notifications: ^18.0.1
  # Background notification polling — WorkManager on Android, BGTaskScheduler on iOS.
  # Matches the Expo app's expo-background-task job: without it, alerts only arrive while
  # the app is open, so a member closing the app stops receiving fee reminders entirely.
  # 0.5.x still used Flutter's v1 embedding (ShimPluginRegistry,
  # PluginRegistrantCallback), which no longer exists — it fails to compile on
  # Flutter 3.41. 0.10.x is the current line.
  workmanager: ^0.10.3
  timezone: ^0.9.4
  http: 1.2.2

  # Boost gateway — the checkout page opens in an in-app WebView. The HMAC signing
  # (and the `crypto` dependency it needed) is gone: the backend holds the merchant
  # secret now, so the app never signs anything.
  flutter_inappwebview: ^6.0.0
  nfc_manager: ^4.2.1

dev_dependencies:
  qr: ^3.0.2 # Generate fictional QR images in the screenshot fixture.
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/fonts/Ionicons.ttf
  assets:
    - assets/images/
    - assets/branding/
    # User-guide screenshots. Regenerate with:
    #   flutter test tool/capture_guide_shots.dart --dart-define=CAPTURE=true
    - assets/guide/

# Launcher icon generation:  dart run flutter_launcher_icons
# The source is assets/branding/app-icon.png (the D-CLIX logo, already cropped to its
# alpha bounds — the master carries ~5% transparent padding, and scaling the file rather
# than the badge leaves a dead ring inside the adaptive icon's safe zone).
# The generator that produced it lived in the retired Expo app; see tag v2.11.1 if the
# masters ever need rebuilding from scratch.
flutter_launcher_icons:
  image_path: "assets/branding/app-icon.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/adaptive-foreground.png"
  ios: true
  remove_alpha_ios: true
